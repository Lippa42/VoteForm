<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visualizzatore — Sfide</title>
  <style>
    :root { color-scheme: dark; --accent: #ff5a63; --bg: #0f1117; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: #eceef5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px 40px; border-bottom: 1px solid #262a36;
    }
    header .title { font-size: 1.6rem; font-weight: 800; }
    header .bgm { display: flex; align-items: center; gap: 10px; color: #a9aebf; font-size: .95rem; }
    header .bgm button { background: #1e212b; border: 1px solid #373c4c; color: #eceef5; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 1rem; }
    header .bgm button:hover { border-color: var(--accent); }
    header .join { display: flex; align-items: center; gap: 20px; }
    header .pin { text-align: right; }
    header .pin b { display: block; font-size: 2rem; letter-spacing: .1em; color: var(--accent); }
    header .pin span { font-size: .8rem; color: #a9aebf; text-transform: uppercase; letter-spacing: .12em; }
    header .qr { width: 96px; height: 96px; background: #fff; border-radius: 10px; padding: 6px; }
    header .qr img { width: 100%; height: 100%; display: block; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; gap: 24px; text-align: center; }
    .qcount { font-size: .9rem; color: #767c90; text-transform: uppercase; letter-spacing: .14em; }
    .question { font-size: clamp(1.7rem, 4vw, 3rem); font-weight: 800; max-width: 22ch; text-wrap: balance; }
    .subject { font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 800; color: var(--accent); }
    .options { display: grid; grid-template-columns: repeat(2, minmax(260px, 1fr)); gap: 16px; width: min(900px, 90vw); }
    .opt { background: #1e212b; border: 2px solid #373c4c; border-radius: 16px; padding: 20px 24px; font-size: 1.3rem; font-weight: 600; text-align: left; }
    .opt.correct { border-color: #2fbe93; background: #10261f; }
    .criteria { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .crit { background: #1e212b; border: 1px solid #373c4c; border-radius: 999px; padding: 8px 16px; font-size: 1.05rem; }
    .crit b { color: var(--accent); }
    .progress { font-size: 1.1rem; color: #a9aebf; }
    .lobby { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 900px; }
    .chip { background: #1e212b; border: 1px solid #373c4c; border-radius: 999px; padding: 8px 16px; font-size: 1rem; }
    .standings { width: min(700px, 90vw); display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; align-items: center; gap: 14px; background: #1e212b; border: 1px solid #262a36; border-radius: 12px; padding: 12px 18px; }
    .row .rank { font-size: 1.4rem; font-weight: 800; color: var(--accent); width: 42px; }
    .row .name { flex: 1; text-align: left; font-size: 1.2rem; }
    .row .pts { font-variant-numeric: tabular-nums; font-weight: 700; }
    .hint { color: #767c90; }
    .poll { width: min(760px, 90vw); display: flex; flex-direction: column; gap: 14px; }
    .pollrow { display: grid; grid-template-columns: 200px 1fr 110px; align-items: center; gap: 14px; }
    .polllabel { text-align: right; font-size: 1.15rem; }
    .pollbar { background: #1e212b; border: 1px solid #262a36; border-radius: 999px; height: 26px; overflow: hidden; }
    .pollfill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .6s ease; }
    .pollpct { font-variant-numeric: tabular-nums; color: #a9aebf; }
    .bracket { display: flex; gap: 28px; align-items: center; justify-content: center; flex-wrap: wrap; }
    .bround { display: flex; flex-direction: column; gap: 18px; }
    .rlabel { font-size: .8rem; color: #767c90; text-transform: uppercase; letter-spacing: .12em; text-align: center; }
    .match { background: #1e212b; border: 1px solid #262a36; border-radius: 12px; overflow: hidden; min-width: 220px; }
    .slot { padding: 12px 16px; font-size: 1.15rem; border-bottom: 1px solid #262a36; }
    .slot:last-child { border-bottom: none; }
    .slot.win { color: #2fbe93; font-weight: 700; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes pop { 0% { transform: scale(.85); opacity: 0; } 60% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }
    .question, .subject { animation: fadeUp .5s ease both; }
    .options .opt { animation: fadeUp .45s ease both; }
    .options .opt:nth-child(1) { animation-delay: .04s; }
    .options .opt:nth-child(2) { animation-delay: .10s; }
    .options .opt:nth-child(3) { animation-delay: .16s; }
    .options .opt:nth-child(4) { animation-delay: .22s; }
    .opt.correct { animation: pop .55s ease both; }
    .slot.win { animation: pop .55s ease both; }
    .row { animation: fadeUp .45s ease both; }
    .row:nth-child(1) { animation-delay: .03s; }
    .row:nth-child(2) { animation-delay: .09s; }
    .row:nth-child(3) { animation-delay: .15s; }
    .row:nth-child(4) { animation-delay: .21s; }
    .row:nth-child(5) { animation-delay: .27s; }
    .match { animation: fadeUp .45s ease both; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</head>
<body>
  <header>
    <div class="title">🎯 Sfide</div>
    <div class="bgm"><button id="bgmBtn" title="Musica di sottofondo">▶</button><span id="bgmTitle"></span></div>
    <div class="join">
      <div class="pin"><span>PIN</span><b id="pin">—</b></div>
      <div class="qr"><img id="qr" alt="QR per entrare" /></div>
    </div>
  </header>
  <audio id="bgmAudio"></audio>
  <main id="main">
    <div class="qcount">In attesa dei giocatori…</div>
    <div class="hint">Inquadra il QR o vai all'indirizzo mostrato per entrare.</div>
  </main>

  <script type="module">
    const main = document.getElementById("main");
    const players = new Map();      // id -> {name, score}  (quiz)
    const competitors = new Map();  // id -> name           (voti)
    let mode = "quiz";
    let lastTurn = null;
    let timerInterval = null;

    function startTimer(seconds) {
      stopTimer();
      if (!seconds) return;
      let remaining = seconds;
      const el = () => document.getElementById("timer");
      const tick = () => { const e = el(); if (e) e.textContent = "⏱ " + Math.max(0, remaining) + "s"; if (remaining <= 0) { stopTimer(); return; } remaining--; };
      tick();
      timerInterval = setInterval(tick, 1000);
    }
    function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }

    function applyTheme(theme) {
      if (!theme) return;
      const r = document.documentElement.style;
      if (theme.primaryColor) r.setProperty("--accent", theme.primaryColor);
      if (theme.backgroundColor) r.setProperty("--bg", theme.backgroundColor);
    }

    // --- Musica di sottofondo (elemento persistente, continua tra le fasi) ---
    const bgmAudio = document.getElementById("bgmAudio");
    let bgmList = [], bgmIndex = 0;
    bgmAudio.addEventListener("ended", () => { if (bgmList.length) { bgmIndex = (bgmIndex + 1) % bgmList.length; playBgm(); } });
    document.getElementById("bgmBtn").onclick = () => {
      if (!bgmList.length) return;
      if (bgmAudio.paused) { if (!bgmAudio.src) playBgm(); else bgmAudio.play().catch(() => {}); }
      else bgmAudio.pause();
      updateBgmBtn();
    };
    function startBgm(list) { if (!list || !list.length) return; bgmList = list; if (!bgmAudio.src) { bgmIndex = 0; playBgm(); } }
    function playBgm() {
      const tr = bgmList[bgmIndex]; if (!tr) return;
      bgmAudio.src = `/asset/${encodeURIComponent(tr.id)}`;
      document.getElementById("bgmTitle").textContent = "♪ " + (tr.title || "");
      bgmAudio.play().then(updateBgmBtn).catch(updateBgmBtn);
    }
    function updateBgmBtn() { document.getElementById("bgmBtn").textContent = bgmAudio.paused ? "▶" : "⏸"; }

    const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
    const room = new URLSearchParams(location.search).get("room");
    const wsUrl = room ? `${wsProto}//${location.host}/client?room=${encodeURIComponent(room)}` : `${wsProto}//${location.host}/ws`;
    const ws = new WebSocket(wsUrl);
    ws.onopen = () => ws.send(JSON.stringify({ type: "join", role: "VIEWER" }));
    ws.onmessage = (e) => handle(JSON.parse(e.data));

    function handle(msg) {
      switch (msg.type) {
        case "snapshot":
          document.getElementById("pin").textContent = msg.room?.meta?.pin ?? "—";
          document.getElementById("qr").src = "/qr";
          mode = msg.room?.mode?.type ?? "quiz";
          applyTheme(msg.room?.theme);
          startBgm(msg.room?.media?.music);
          competitors.clear();
          (msg.room?.participants?.competitors ?? []).forEach((c) => competitors.set(c.id, c.name));
          renderLobby();
          break;
        case "players":
          players.clear();
          msg.players.forEach((p) => players.set(p.id, { name: p.name, score: p.score }));
          if (currentView === "lobby") renderLobby();
          break;
        case "turn":
          if (msg.phase === "FINISHED") renderStandings("Classifica finale", quizStandings());
          else renderQuestion(msg, false);
          break;
        case "vote_turn":
          if (msg.phase === "FINISHED") renderStandings("Classifica finale", null);
          else renderSubject(msg);
          break;
        case "progress":
          { const el = document.getElementById("progress"); if (el) el.textContent = `${currentView === "subject" ? "Voti" : "Risposte"}: ${msg.answered} / ${msg.total}`; }
          break;
        case "reveal":
          if (msg.subjectId != null) renderVotingReveal(msg);
          else if (msg.distribution && Object.keys(msg.distribution).length) renderSurvey(msg);
          else renderQuestion(lastTurn, true, msg.correctOptionIds);
          break;
        case "bracket":
          renderBracket(msg);
          break;
        case "screen":
          renderScreen(msg);
          break;
        case "scoreboard":
          renderScoreBoard(msg);
          break;
        case "music":
          if (msg.action === "pause") bgmAudio.pause();
          else if (msg.action === "resume" || msg.action === "play") bgmAudio.play().catch(() => {});
          else if (msg.action === "skip" && bgmList.length) { bgmIndex = (bgmIndex + 1) % bgmList.length; playBgm(); }
          updateBgmBtn();
          break;
      }
    }

    function renderScreen(msg) {
      stopTimer();
      currentView = "screen";
      if (msg.kind === "media") {
        let media;
        if (msg.assetId) {
          const src = `/asset/${encodeURIComponent(msg.assetId)}`;
          if (msg.mediaKind === "MUSIC") media = `<audio controls autoplay src="${src}"></audio>`;
          else if (msg.mediaKind === "VIDEO") media = `<video controls autoplay playsinline style="max-width:82vw;max-height:66vh;border-radius:16px" src="${src}"></video>`;
          else media = `<img src="${src}" alt="" style="max-width:82vw;max-height:66vh;border-radius:16px" />`;
        } else {
          const icon = msg.mediaKind === "MUSIC" ? "🎵" : msg.mediaKind === "VIDEO" ? "🎬" : "🖼️";
          media = `<div class="subject">${icon}</div>`;
        }
        main.innerHTML = `<div class="qcount">Fase ${msg.index} / ${msg.total}</div>
          ${media}
          <div class="question">${escape(msg.title)}</div>
          ${msg.caption ? `<div class="hint">${escape(msg.caption)}</div>` : ""}`;
      } else {
        main.innerHTML = `<div class="question">${escape(msg.title)}</div>
          ${msg.subtitle ? `<div class="qcount">${escape(msg.subtitle)}</div>` : ""}`;
      }
    }

    function renderScoreBoard(msg) {
      stopTimer();
      currentView = "scoreboard";
      const rows = msg.entries.map((e) => rowHtml(e.rank, e.name, e.score)).join("");
      const champ = msg.entries.find((e) => e.id === msg.champion);
      const head = msg.isFinal && champ
        ? `<div class="qcount">Vincitore</div><div class="subject">🏆 ${escape(champ.name)}</div>`
        : `<div class="question">${escape(msg.title)}</div>`;
      main.innerHTML = `${head}<div class="standings">${rows}</div>`;
    }

    function renderBracket(b) {
      stopTimer();
      currentView = "bracket";
      const byRound = {};
      b.matches.forEach((m) => { (byRound[m.round] ||= []).push(m); });
      const cols = Object.keys(byRound).sort((x, y) => x - y).map((r) => {
        const ms = byRound[r].map((m) => {
          const aCls = m.winner && m.winner === m.slotA ? "slot win" : "slot";
          const bCls = m.winner && m.winner === m.slotB ? "slot win" : "slot";
          return `<div class="match"><div class="${aCls}">${cname(m.slotA)}</div><div class="${bCls}">${cname(m.slotB)}</div></div>`;
        }).join("");
        return `<div class="bround"><div class="rlabel">Turno ${r}</div>${ms}</div>`;
      }).join("");
      const head = b.champion
        ? `<div class="qcount">Campione</div><div class="subject">🏆 ${cname(b.champion)}</div>`
        : `<div class="qcount">Tabellone — sorteggio</div>`;
      main.innerHTML = `${head}<div class="bracket">${cols}</div>`;
    }

    function cname(id) { return id ? escape(competitors.get(id) ?? id) : "—"; }

    function renderSurvey(msg) {
      stopTimer();
      currentView = "survey";
      const opts = lastTurn?.prompt?.options ?? [];
      const dist = msg.distribution || {};
      const total = Object.values(dist).reduce((a, b) => a + b, 0) || 1;
      const rows = opts.map((o) => {
        const c = dist[o.id] || 0;
        const pct = Math.round((c * 100) / total);
        return `<div class="pollrow"><div class="polllabel">${escape(o.text)}</div>
          <div class="pollbar"><div class="pollfill" style="width:${pct}%"></div></div>
          <div class="pollpct">${pct}% (${c})</div></div>`;
      }).join("");
      main.innerHTML = `<div class="qcount">Il pubblico ha detto</div>
        <div class="question">${escape(lastTurn?.prompt?.title ?? "")}</div>
        <div class="poll">${rows}</div>`;
    }

    let currentView = "lobby";

    function renderLobby() {
      currentView = "lobby";
      const list = mode === "voting" ? [...competitors.values()] : [...players.values()].map((p) => p.name);
      const label = mode === "voting" ? (list.length ? "Concorrenti" : "In attesa…") : (list.length ? "Giocatori in sala" : "In attesa dei giocatori…");
      const chips = list.map((n) => `<div class="chip">${escape(n)}</div>`).join("");
      main.innerHTML = `<div class="qcount">${label}</div><div class="lobby">${chips}</div>
        <div class="hint">Inquadra il QR o vai all'indirizzo mostrato per entrare.</div>`;
    }

    function renderQuestion(turn, revealed, correct = []) {
      if (!turn) return;
      currentView = "question";
      lastTurn = turn;
      const opts = turn.prompt.options.map((o) => {
        const cls = revealed && correct.includes(o.id) ? "opt correct" : "opt";
        return `<div class="${cls}">${escape(o.text)}</div>`;
      }).join("");
      main.innerHTML = `<div class="qcount">Domanda ${turn.index} / ${turn.total}</div>
        <div class="question">${escape(turn.prompt.title)}</div>
        <div class="options">${opts}</div>
        ${revealed ? `<div class="progress">${quizTop()}</div>` : `<div class="progress" id="progress">Risposte: 0 / ${players.size}</div><div class="progress" id="timer"></div>`}`;
      if (revealed || turn.locked) stopTimer(); else startTimer(turn.timerSeconds);
    }

    function renderSubject(turn) {
      currentView = "subject";
      lastTurn = turn;
      const crits = turn.criteria.map((c) => `<div class="crit">${escape(c.label)} <b>×${c.weight}</b></div>`).join("");
      main.innerHTML = `<div class="qcount">Prova ${turn.index} / ${turn.total} · ${escape(turn.promptTitle)}</div>
        <div class="qcount">Sta votando</div>
        <div class="subject">${escape(turn.competitorName)}</div>
        <div class="criteria">${crits}</div>
        <div class="progress" id="progress">Voti: 0 / —</div>
        <div class="progress" id="timer"></div>`;
      if (turn.locked) stopTimer(); else startTimer(turn.timerSeconds);
    }

    function renderVotingReveal(msg) {
      stopTimer();
      const rows = msg.standings.map((s) => rowHtml(s.rank, competitors.get(s.competitorId) ?? s.competitorId, s.points)).join("");
      const subject = competitors.get(msg.subjectId) ?? msg.subjectId;
      main.innerHTML = `<div class="qcount">${escape(subject)} ha totalizzato</div>
        <div class="subject">${msg.subjectScore}</div>
        <div class="standings">${rows}</div>`;
    }

    function renderStandings(title, rows) {
      stopTimer();
      currentView = "standings";
      const html = (rows ?? []).map((r) => rowHtml(r.rank, r.name, r.points)).join("");
      main.innerHTML = `<div class="question">${title}</div><div class="standings">${html}</div>`;
    }

    function rowHtml(rank, name, pts) {
      return `<div class="row"><div class="rank">${rank}</div><div class="name">${escape(name)}</div><div class="pts">${pts} pt</div></div>`;
    }

    function quizStandings() {
      return [...players.values()].sort((a, b) => b.score - a.score).map((p, i) => ({ rank: i + 1, name: p.name, points: p.score }));
    }
    function quizTop() {
      const top = [...players.values()].sort((a, b) => b.score - a.score)[0];
      return top ? `In testa: ${escape(top.name)} (${top.score} pt)` : "";
    }

    function escape(s) {
      return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }
  </script>
</body>
</html>
